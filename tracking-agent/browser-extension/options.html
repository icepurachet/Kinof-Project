<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <title>KINOF Web Guard</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 20px; }
      label { display: block; margin-top: 16px; font-weight: 600; }
      input { box-sizing: border-box; width: 100%; padding: 10px; margin-top: 6px; }
      button { margin-top: 20px; padding: 10px 18px; }
      #status { margin-left: 12px; }
    </style>
  </head>
  <body>
    <h1>KINOF Lab Web Guard</h1>
    <p>ส่วนเสริมเก็บเฉพาะชื่อโดเมน ไม่เก็บ path, query, เนื้อหาหน้าเว็บ หรือรหัสผ่าน</p>
    <label>Backend URL <input id="apiUrl" type="url" /></label>
    <label>Agent API key <input id="apiKey" type="password" autocomplete="off" /></label>
    <button id="save" type="button">บันทึกและซิงก์</button><span id="status"></span>
    <script src="options.js"></script>
  </body>
</html>
